[project]
name = "update_pages"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "airtable-python-wrapper>=0.15.3",
  "tqdm>=4.70.1",
  "pandas>=2.1.3",
  "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = ["ipykernel>=7.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/update_pages"]


[tool.uv]
override-dependencies = ["certifi>=2026.10.19"]
