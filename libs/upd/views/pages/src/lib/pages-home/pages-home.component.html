<h2 class="mb-4">{{ activePageTitle() }}</h2>

<div class="tabs sticky pages-home-tabs">
  <ul role="tablist" aria-label="{{ 'menu-pages' | translate }}">
    @for (tab of homeTabs(); track tab.title) {
      <li role="presentation">
        <a
          role="tab"
          [routerLink]="tab.route"
          [routerLinkActive]="['active']"
          [routerLinkActiveOptions]="{ exact: true }"
          [queryParamsHandling]="'merge'"
        >
          {{ tab.title | translate }}
        </a>
      </li>
    }
  </ul>
</div>

<upd-date-selector></upd-date-selector>

<upd-card [title]="activeCardTitle()" titleSize="h5" [ngClass]="'pages-home'">
  <upd-data-table
    [id]="activeIdPrefix()"
    [data]="(pagesHomeData$ | async) || []"
    [cols]="effectiveColumns || []"
    [displayRows]="25"
    [loading]="(loading$ | async) || false"
    placeholderText="dt_search_keyword_url"
    [searchFields]="searchFields || []"
  >
  </upd-data-table>
</upd-card>
